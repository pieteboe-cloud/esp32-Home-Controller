[env:esp32doit-devkit-v1]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs

; Compile all diagnostic calls so the runtime dashboard can select levels 1-5.
; Debug::println() still filters the output at runtime.
build_flags =
    -D DEBUG_LEVEL=5

lib_deps =
    lib/vendor/rc-switch
    lib/vendor/irremote
    ArduinoJson @^7.4.3
    https://github.com/ESP32Async/AsyncTCP.git#v3.4.10
    https://github.com/ESP32Async/ESPAsyncWebServer.git#v3.11.2
